spring:
  application:
    name: demo-user
  web:
    resources:
      static-locations: classpath:/static/, classpath:/static/bootstrap/
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/user_db
    username: root
    password: 1234
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
  security:
    user:
      name: user
      password: 1234
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    properties:
      spring.json.trusted.packages: "*"
    template:
      observation-enabled: true
    listener:
      log-container-config: false
      observation-enabled: true
  elasticsearch:
    uris: http://localhost:9200
    username: elastic
    password: changeme
logging:
  level:
    root: info
    com.example.demo: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.apache.kafka: warn
    org.springframework.kafka: warn
management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info, metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: demo
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
jwt:
  secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef}
grpc:
  server:
    reflection-service-enabled: true
    port: 9191