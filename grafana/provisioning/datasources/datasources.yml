apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    jsonData:
      # Loki 로그 행에서 traceId=xxx 패턴을 자동 인식해서 Tempo로 점프
      derivedFields:
        - name: TraceID
          matcherRegex: 'traceId=(\w+)'
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: 'View trace'

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    jsonData:
      # Trace 화면에서 같은 traceId의 로그를 Loki로 점프
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterByTraceID: true
        tags:
          - key: service.name
            value: app
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
